name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # PNPM_VERSION se lee automáticamente del campo packageManager de package.json.
  # No hardcodearla acá para evitar duplicación y drift.

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Upload pnpm store
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.local/share/pnpm/store
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            packages/anonymization-core/*/node_modules
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: Typecheck
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Unit + Contract + Snapshot
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Gate de cobertura: los thresholds por paquete viven en vitest.config.ts
      # (≥ 85% líneas por módulo tocado, ai/Code_Standards.md §10). Si un paquete
      # implementado queda por debajo, este paso falla.
      - run: pnpm test -- --coverage

  build:
    name: Build
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Compila los paquetes del Core a `dist/` — el modo en que se PUBLICAN,
      # con `.d.ts` y sin tests. Ningún otro gate lo ejercita: `dev`, los tests,
      # el E2E y el build de la app leen el código fuente.
      #
      # Estuvo roto desde el Hito 1 (`5eb30d2`, 2026-06-18) y nadie se enteró en
      # dos meses y medio, justamente porque no estaba acá. Un comando que no
      # corre en CI no es un gate: es una intención.
      - run: pnpm build

  audit:
    name: Security audit
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Bloqueante desde el Hito 11: la nota que lo prometía venció, y hasta
      # acá este job tenía `continue-on-error` DOS veces (job y step), así que
      # daba verde pasara lo que pasara.
      #
      # El problema no era solo que no bloqueara. `pnpm audit` consulta un
      # endpoint del registry, así que puede fallar **por red** sin decir nada
      # sobre vulnerabilidades — y los dos casos salen con exit 1. Sacar los
      # `continue-on-error` sin más convertía un timeout en un rojo que no
      # significa "hay una vulnerabilidad", y un gate que está rojo por el
      # motivo equivocado se ignora primero y se apaga después.
      #
      # Los dos desenlaces se separan: un fallo de red se reintenta, y si tras
      # tres intentos el audit no pudo correr, el job falla con un mensaje que
      # dice **eso** y no otra cosa. Un gate que no pudo ejecutarse no es un
      # gate verde: significa que no sabemos.
      - name: Audit (severidad alta y crítica)
        run: |
          for intento in 1 2 3; do
            if salida="$(pnpm audit --audit-level=high 2>&1)"; then
              echo "$salida"
              exit 0
            fi
            echo "$salida"
            if echo "$salida" | grep -qE 'ERR_SOCKET_TIMEOUT|FetchError|ECONNRESET|ETIMEDOUT|ENOTFOUND|EAI_AGAIN|socket hang up'; then
              echo "::warning::El audit no pudo consultar el registry (intento ${intento}/3)."
              sleep $((intento * 20))
              continue
            fi
            echo "::error::pnpm audit encontró vulnerabilidades de severidad alta o crítica."
            exit 1
          done
          echo "::error::El audit no pudo ejecutarse tras 3 intentos: no se sabe si hay vulnerabilidades."
          exit 1

  # Gates que se activan en hitos posteriores.
  # Cada uno corre solo si su directorio de tests existe (hashFiles check).

  test-e2e:
    name: E2E (Playwright)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check if e2e tests exist
        id: check_e2e
        run: |
          if [ -d "tests/e2e" ] && [ -n "$(find tests/e2e -name '*.spec.ts' -type f 2>/dev/null)" ]; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No e2e tests found, skipping."
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Assets first-party (modelo NER, wasm de tesseract/ort) nunca se
      # commitean (ADR-018): `pnpm test:e2e` los necesita para que Vite
      # resuelva el `import ?url` de `src/assets/onnxruntime/` (si no, el
      # webServer de Playwright no sirve una app funcional y toda la suite se
      # cae, no solo los escenarios de NER/OCR — ADR-048 §1). Cache por hash
      # de `assets.lock.json`, antes del mirror, para que sea no-op si pega.
      - name: Cache first-party assets (wasm/models)
        if: steps.check_e2e.outputs.has_tests == 'true'
        uses: actions/cache@v4
        with:
          path: |
            apps/react-client/public/wasm
            apps/react-client/public/models
            apps/react-client/src/assets/onnxruntime
          key: assets-mirror-${{ hashFiles('assets.lock.json') }}
      - name: Mirror first-party assets
        if: steps.check_e2e.outputs.has_tests == 'true'
        run: pnpm assets:mirror
      - name: Install Playwright browsers
        if: steps.check_e2e.outputs.has_tests == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Run e2e tests
        if: steps.check_e2e.outputs.has_tests == 'true'
        run: pnpm test:e2e

  test-perf:
    name: Performance
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check if perf tests exist
        id: check_perf
        run: |
          if [ -d "tests/perf" ] && [ -n "$(find tests/perf -name '*.test.ts' -type f 2>/dev/null)" ]; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No perf tests found, skipping."
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run perf tests
        if: steps.check_perf.outputs.has_tests == 'true'
        run: pnpm test:perf

  test-leak:
    name: Memory leak
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check if leak tests exist
        id: check_leak
        run: |
          if [ -d "tests/leak" ] && [ -n "$(find tests/leak -name '*.test.ts' -type f 2>/dev/null)" ]; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No leak tests found, skipping."
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run leak tests
        if: steps.check_leak.outputs.has_tests == 'true'
        run: pnpm test:leak

  test-cancel:
    name: Cancellation SLA
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check if cancel tests exist
        id: check_cancel
        run: |
          if [ -d "tests/cancel" ] && [ -n "$(find tests/cancel -name '*.test.ts' -type f 2>/dev/null)" ]; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No cancel tests found, skipping."
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run cancel tests
        if: steps.check_cancel.outputs.has_tests == 'true'
        run: pnpm test:cancel

  test-stress:
    name: Stress
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check if stress tests exist
        id: check_stress
        run: |
          if [ -d "tests/stress" ] && [ -n "$(find tests/stress -name '*.test.ts' -type f 2>/dev/null)" ]; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No stress tests found, skipping."
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run stress tests
        if: steps.check_stress.outputs.has_tests == 'true'
        run: pnpm test:stress

  test-security:
    name: Security gates
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check if security tests exist
        id: check_security
        run: |
          if [ -d "tests/security" ] && [ -n "$(find tests/security -name '*.test.ts' -type f 2>/dev/null)" ]; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No security tests found, skipping."
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run security tests
        if: steps.check_security.outputs.has_tests == 'true'
        run: pnpm test:security

  # Resumen: comentario automático en el PR con el estado de los gates.
  # Se activa cuando existe al menos un job opcional corriendo.
  pr-summary:
    name: PR summary
    needs: [lint, typecheck, test, audit]
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Summary
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Typecheck | ${{ needs.typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Audit | ${{ needs.audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Mergeá solo si todos dicen \`success\`._" >> $GITHUB_STEP_SUMMARY
