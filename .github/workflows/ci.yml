name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Para lanzar a mano, sobre cualquier branch, los gates que no corren en
  # cada PR (fugas y estrés).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # PNPM_VERSION se lee automáticamente del campo packageManager de package.json.
  # No hardcodearla acá para evitar duplicación y drift.
  # `onnxruntime-node` baja los binarios de CUDA en su postinstall, y **solo en
  # linux/x64**: su `install-metadata.js` declara `requirements` vacíos para
  # macOS y Windows, y `["cuda12"]` para Linux. Los binarios de CPU ya vienen
  # adentro del paquete, así que lo único que baja son cientos de MB de
  # aceleración por GPU — en un runner que no tiene GPU.
  #
  # Se saltea. El script lee esta variable antes que nada y sale con 0 sin
  # pedir nada a la red (`install-utils.js`, `parseInstallFlag`): verificado
  # ejecutándolo, no leyendo el README.
  #
  # Entra acá porque es de donde llegó a romper: un ETIMEDOUT contra
  # api.nuget.org tumbó el job entero. `onnxruntime-node` es transitiva de
  # `@huggingface/transformers`, que los tests de integración sí usan en Node
  # —por eso no se bloquea el postinstall entero, solo la parte que no viene
  # empaquetada—.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Upload pnpm store
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/pnpm/store
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            packages/anonymization-core/*/node_modules
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - name: Release tooling tests
        run: |
          pnpm exec tsc -p .github/scripts/tsconfig.json
          node --test .github/scripts/prepare-release-assets.test.mjs

  typecheck:
    name: Typecheck
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Unit + Contract + Snapshot
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Gate de cobertura: los thresholds por paquete viven en vitest.config.ts
      # (≥ 85% líneas por módulo tocado, ai/Code_Standards.md §10). Si un paquete
      # implementado queda por debajo, este paso falla.
      - run: pnpm test -- --coverage

  build:
    name: Build
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Compila los paquetes del Core a `dist/` — el modo en que se PUBLICAN,
      # con `.d.ts` y sin tests. Ningún otro gate lo ejercita: `dev`, los tests,
      # el E2E y el build de la app leen el código fuente.
      #
      # Estuvo roto desde el Hito 1 (`5eb30d2`, 2026-06-18) y nadie se enteró en
      # dos meses y medio, justamente porque no estaba acá. Un comando que no
      # corre en CI no es un gate: es una intención.
      - run: pnpm build

  audit:
    name: Security audit
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Bloquea cuando SABE, avisa cuando no puede saber.
      #
      # `pnpm audit` consulta `/-/npm/v1/security/audits`, el endpoint viejo de
      # npm, y hoy **no responde**: falla con `ERR_SOCKET_TIMEOUT` tanto en los
      # runners de GitHub como fuera de ellos. O sea que un exit 1 de este
      # comando puede significar dos cosas opuestas —"encontré una
      # vulnerabilidad" o "no pude preguntar"—, y hasta acá las dos se trataban
      # igual: primero se tragaban las dos (el job daba verde con seis alertas
      # `high` abiertas), después bloqueaban las dos (una corrida de 10 minutos
      # que terminaba en rojo por la red y frenaba un merge).
      #
      # Ninguna de las dos es correcta, y la asimetría es la respuesta:
      #
      # - **Hallazgo** → falla. Es la razón de ser del gate.
      # - **No se pudo consultar** → `::warning::` visible y sigue. Un endpoint
      #   caído de un tercero no es motivo para frenar un merge, y un rojo
      #   permanente por el motivo equivocado se ignora primero y se apaga
      #   después.
      #
      # Sin reintentos y con timeout corto (`npm_config_fetch_*`): mientras ese
      # endpoint esté caído, reintentar solo alarga el fallo. La corrida pasa de
      # ~10 minutos a segundos.
      #
      # Esto es un puente, no el destino: el gate tiene que mudarse a una fuente
      # que funcione — las alertas de Dependabot, que son las que de hecho
      # encontraron las seis `high`. Anotado en `Post_Hito10.8_Pendientes.md`.
      - name: Audit (severidad alta y crítica)
        env:
          npm_config_fetch_retries: "0"
          npm_config_fetch_timeout: "20000"
        run: |
          # ADR-201: el único advisory aceptado requiere parche instalado,
          # lockfile y hashes exactos, y regresiones ejecutadas antes del audit.
          if salida="$(pnpm audit:security 2>&1)"; then
            echo "$salida"
            exit 0
          fi
          echo "$salida"
          if echo "$salida" | grep -qE 'ERR_SOCKET_TIMEOUT|FetchError|ECONNRESET|ETIMEDOUT|ENOTFOUND|EAI_AGAIN|socket hang up'; then
            echo "::warning::El audit no pudo consultar el registry, así que este gate NO dice nada sobre vulnerabilidades. Ver las alertas de Dependabot del repo."
            exit 0
          fi
          echo "::error::pnpm audit encontró vulnerabilidades de severidad alta o crítica."
          exit 1

  # Gates que se activan en hitos posteriores.
  # Cada uno corre solo si su directorio de tests existe (hashFiles check).

  # Partido en dos mitades en paralelo: de a uno, los E2E tardaban más de diez
  # minutos en el runner. El check requerido para mergear sigue siendo
  # "E2E (Playwright)", que es el job de más abajo y junta las dos mitades.
  test-e2e-shard:
    name: E2E mitad ${{ matrix.shard }}/2
    needs: install
    # ADR-208: corre en todo PR y push a main y develop, y a mano. Un PR a
    # develop exige los mismos gates que uno a main; antes el E2E solo
    # aparecía al integrar y el fallo llegaba tarde (ADR-199 §3, enmendado).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # macOS y no ubuntu: desde ADR-130 los E2E corren contra el contenedor
    # de escritorio, o sea una app de Electron con ventana. En un runner de
    # Linux eso necesita un display virtual (xvfb) — y encima probaría una
    # plataforma que el proyecto no publica. macOS es uno de los dos targets
    # reales, y en repos públicos el runner es gratis.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check if e2e tests exist
        id: check_e2e
        run: |
          if [ -d "tests/e2e" ] && [ -n "$(find tests/e2e -name '*.spec.ts' -type f 2>/dev/null)" ]; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No e2e tests found, skipping."
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Assets first-party (modelo NER, wasm de tesseract/ort) nunca se
      # commitean (ADR-018): `pnpm test:e2e` los necesita para que Vite
      # resuelva el `import ?url` de `src/assets/onnxruntime/` (si no, el
      # webServer de Playwright no sirve una app funcional y toda la suite se
      # cae, no solo los escenarios de NER/OCR — ADR-048 §1). Cache por hash
      # de `assets.lock.json`, antes del mirror, para que sea no-op si pega.
      - name: Cache first-party assets (wasm/models)
        if: steps.check_e2e.outputs.has_tests == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/react-client/public/wasm
            apps/react-client/public/models
            apps/react-client/src/assets/onnxruntime
          key: assets-mirror-${{ hashFiles('assets.lock.json') }}
      - name: Mirror first-party assets
        if: steps.check_e2e.outputs.has_tests == 'true'
        run: pnpm assets:mirror
      - name: Install Playwright browsers
        if: steps.check_e2e.outputs.has_tests == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Run e2e tests
        if: steps.check_e2e.outputs.has_tests == 'true'
        run: pnpm test:e2e --shard=${{ matrix.shard }}/2

  test-e2e:
    name: E2E (Playwright)
    needs: [test-e2e-shard, export-verification]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Las dos mitades de E2E pasaron
        env:
          SHARDS_RESULT: ${{ needs.test-e2e-shard.result }}
          EXPORT_RESULT: ${{ needs.export-verification.result }}
        run: |
          if [ "$SHARDS_RESULT" != "success" ]; then
            echo "::error::Los E2E no pasaron (resultado de las mitades: $SHARDS_RESULT)."
            exit 1
          fi
          if [ "$EXPORT_RESULT" != "success" ]; then
            echo "::error::La verificación del PDF exportado no pasó (resultado: $EXPORT_RESULT)."
            exit 1
          fi

  export-verification:
    name: Export verification
    needs: install
    # Mismos eventos que E2E (ADR-208): PR y push a main y develop, y dispatch.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache first-party assets (wasm/models)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/react-client/public/wasm
            apps/react-client/public/models
            apps/react-client/src/assets/onnxruntime
          key: assets-mirror-${{ hashFiles('assets.lock.json') }}
      - name: Run export verification gate
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/export-verification.json
        run: pnpm test:export-verification
      - name: Upload synthetic export verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: export-verification-evidence
          path: |
            test-results/export-verification.json
            test-results/export-verification-artifacts
          retention-days: 7
          if-no-files-found: error

  test-perf:
    name: Performance
    needs: install
    # Mismos eventos que E2E (ADR-208).
    # Perf mide Electron con ventana sobre un target nativo publicado, igual
    # que E2E; Ubuntu sin display medía otro entorno y podía omitir el gate.
    runs-on: macos-latest
    # ADR-149 §1: un tope explícito. El gate son 4 tests de un solo spec
    # (`pipeline-timing.spec.ts`); el resto de `tests/perf/` son campañas que se
    # corren por archivo y no entran acá.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ADR-149 §1: sin el spec del gate el job falla, no se saltea.
      - name: Ensure the perf gate spec exists
        run: |
          if [ ! -f tests/perf/pipeline-timing.spec.ts ]; then
            echo "::error::tests/perf/pipeline-timing.spec.ts not found; the test:perf gate must not pass empty."
            exit 1
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache first-party assets (wasm/models)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/react-client/public/wasm
            apps/react-client/public/models
            apps/react-client/src/assets/onnxruntime
          key: assets-mirror-${{ hashFiles('assets.lock.json') }}
      - name: Mirror first-party assets
        run: pnpm assets:mirror
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium
      # Mide y reporta los tiempos SIN aplicar el umbral de 8 s (decisión del
      # humano, 2026-09-29; ADR-149 §5): el runner no es el hardware de
      # referencia. El umbral se aplica en local, antes de cada release, con
      # `ANONLY_PERF_ENFORCE_BUDGET=1`. Falla igual si el pipeline no llega a
      # Ready o si nada corrió.
      - name: Run perf gate (measures and reports; no time threshold)
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: perf-report.json
        run: pnpm test:perf
      # El mínimo (4) es el número de tests que tiene hoy `pipeline-timing.spec.ts`:
      # se sube a mano cuando se agreguen más (mismo criterio que Cancel).
      - name: Assert perf tests actually ran (ADR-149 §1)
        run: node scripts/ci/assert-min-tests.mjs --report perf-report.json --min 4 --format playwright

  # Los tres casos de fuga corren en paralelo, uno por runner, como las mitades
  # de E2E (ADR-185, enmienda del 2026-10-02): cada caso mide solo en su
  # máquina, así que el protocolo de medición no cambia y el tiempo total es el
  # del caso más largo. `fail-fast: false` para ver los tres resultados.
  test-leak-case:
    name: Memory leak ${{ matrix.case }}
    needs: install
    # No corre en cada push de un PR (tarda entre 15 y 30 minutos): corre al
    # mergear a `main` y cuando se lo lanza a mano (ADR-185, enmienda del
    # 2026-10-01).
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        case: [L1, L2, L3]
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ADR-149 §1 (y ADR-185 §5, aclaración del 2026-09-29): sin specs el job
      # falla, no se saltea.
      - name: Ensure leak specs exist
        run: |
          if [ ! -d tests/leak ] || [ -z "$(find tests/leak -name '*.spec.ts' -type f 2>/dev/null)" ]; then
            echo "::error::No Playwright leak specs found; the test:leak gate must not pass empty."
            exit 1
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache first-party assets (wasm/models)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/react-client/public/wasm
            apps/react-client/public/models
            apps/react-client/src/assets/onnxruntime
          key: assets-mirror-${{ hashFiles('assets.lock.json') }}
      - name: Mirror first-party assets
        run: pnpm assets:mirror
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium
      # El caso se elige por el título del test (`L1 — ...`). Un caso que no
      # matchee ningún test hace fallar a Playwright ("No tests found"), no pasa
      # vacío; además el assert de abajo exige al menos 1 ejecutado y 0 salteados.
      - name: Run leak case ${{ matrix.case }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: leak-report.json
        run: pnpm test:leak --grep "${{ matrix.case }} "
      - name: Assert the leak case actually ran (ADR-149 §1)
        run: node scripts/ci/assert-min-tests.mjs --report leak-report.json --min 1 --format playwright

  test-leak:
    name: Memory leak
    needs: test-leak-case
    # `always()` para juntar el resultado aunque un caso falle; la condición de
    # evento es la misma que la de los casos, para que en un PR no corra.
    if: always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    steps:
      - name: Los tres casos de fuga pasaron
        env:
          CASES_RESULT: ${{ needs.test-leak-case.result }}
        run: |
          if [ "$CASES_RESULT" != "success" ]; then
            echo "::error::La fuga de memoria no pasó (resultado de los casos: $CASES_RESULT)."
            exit 1
          fi

  test-cancel:
    name: Cancellation SLA
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ADR-149 §1: sin "Check if cancel tests exist" ni `if:` — el job corre
      # siempre y falla si el runner no ejecutó nada. `pnpm test:cancel`
      # falla igual si `tests/cancel` no existe (Vitest no encuentra specs),
      # así que ESTE step no necesita su propio guard — el mínimo real lo
      # exige el siguiente.
      - name: Run cancel tests
        run: pnpm exec vitest run tests/cancel --reporter=default --reporter=json --outputFile=cancel-report.json
      # El mínimo (4) es el número de tests que tiene hoy `tests/cancel` —
      # se sube a mano cuando se agreguen más (nunca se calcula solo: un
      # cálculo automático no distinguiría "se borró un test" de "nunca
      # hizo falta tener más").
      - name: Assert cancel tests actually ran (ADR-149 §1)
        run: node scripts/ci/assert-min-tests.mjs --report cancel-report.json --min 4

  test-stress:
    name: Stress
    needs: install
    # No corre en cada push de un PR (tarda entre 15 y 30 minutos): corre al
    # mergear a `main` y cuando se lo lanza a mano (ADR-185, enmienda del
    # 2026-10-01).
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ADR-149 §1 (y ADR-185 §5, aclaración del 2026-09-29): sin specs el job
      # falla, no se saltea.
      - name: Ensure stress specs exist
        run: |
          if [ ! -d tests/stress ] || [ -z "$(find tests/stress -name '*.spec.ts' -type f 2>/dev/null)" ]; then
            echo "::error::No Playwright stress specs found; the test:stress gate must not pass empty."
            exit 1
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache first-party assets (wasm/models)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/react-client/public/wasm
            apps/react-client/public/models
            apps/react-client/src/assets/onnxruntime
          key: assets-mirror-${{ hashFiles('assets.lock.json') }}
      - name: Mirror first-party assets
        run: pnpm assets:mirror
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium
      - name: Run stress tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: stress-report.json
        run: pnpm test:stress
      # El mínimo (3) es el número de tests que tiene hoy `tests/stress/stress.spec.ts`
      # (P2 50p, P2 200p y el centinela de razones): se sube a mano cuando se
      # agreguen más.
      - name: Assert stress tests actually ran (ADR-149 §1)
        run: node scripts/ci/assert-min-tests.mjs --report stress-report.json --min 3 --format playwright

  test-security:
    name: Security gates
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check if security tests exist
        id: check_security
        run: |
          if [ -d "tests/security" ] && [ -n "$(find tests/security -name '*.test.ts' -type f 2>/dev/null)" ]; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "No security tests found, skipping."
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run security tests
        if: steps.check_security.outputs.has_tests == 'true'
        run: pnpm test:security

  # Resumen: comentario automático en el PR con el estado de los gates.
  # Se activa cuando existe al menos un job opcional corriendo.
  pr-summary:
    name: PR summary
    needs: [lint, typecheck, test, build, audit]
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Summary
        run: |
          {
            echo "## CI Summary"
            echo ""
            echo "| Gate | Status |"
            echo "|---|---|"
            echo "| Lint | ${{ needs.lint.result }} |"
            echo "| Typecheck | ${{ needs.typecheck.result }} |"
            echo "| Tests | ${{ needs.test.result }} |"
            echo "| Build | ${{ needs.build.result }} |"
            echo "| Audit | ${{ needs.audit.result }} |"
            echo ""
            echo "_Mergeá solo si todos dicen \`success\`._"
          } >> "$GITHUB_STEP_SUMMARY"
