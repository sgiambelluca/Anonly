<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Logo de Anonly: un documento con una línea de texto reemplazada por una
    barra de censura. Concepto y porqué en `src/components/common/Logo.tsx`.

    **Ajuste óptico propio, no una copia del componente.** A 16 px el trazo de
    1.75 del logo de pantalla queda en un pelo y las dos líneas finas de texto
    se vuelven ruido. Acá el trazo sube a 2.5, las líneas engordan y la barra
    crece: lo que tiene que sobrevivir al tamaño chico es "página con una barra
    cruzándola", y todo lo demás compite con eso.

    Colores literales y no tokens: un favicon se sirve suelto, sin la hoja de
    estilos de la app.
  -->
