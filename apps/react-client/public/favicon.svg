  <path d="M18.5 3V8a2 2 0 0 0 2 2h5" fill="none" stroke="#111827" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="10.5" y="13.5" width="8" height="2.2" rx="1.1" fill="#6b7280"/>
  <rect x="10.5" y="24" width="6" height="2.2" rx="1.1" fill="#6b7280"/>
