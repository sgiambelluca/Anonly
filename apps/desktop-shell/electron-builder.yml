# Empaquetado de Anonly (ADR-130, ADR-131).
#
# El instalador pesa ~350 MB y eso es esperable: los ~243 MB del `dist` del
# renderer —modelo NER, wasm de Tesseract y de onnxruntime, cmaps de pdfjs—
# viajan adentro en vez de descargarse a demanda. Es la inversión de ADR-018
# que ADR-130 decidió: cero red en el primer uso, y el caché de IndexedDB deja
# de ser un punto único de falla.

appId: io.github.sgiambelluca.anonly
productName: Anonly
copyright: Copyright © 2026 Santino Giambelluca

directories:
  output: release
  buildResources: assets

# Lo único que entra al asar es el shell compilado. El renderer NO: va como
# recurso suelto (ver `extraResources`).
files:
  - dist/**/*
  - package.json

# `rendererRoot()` en `src/paths.ts` busca exactamente acá: `<resources>/renderer`.
# Fuera del asar a propósito — son ~243 MB de wasm y modelos que el runtime
# lee por el protocolo `app://`, y empaquetarlos en un archivo comprimido solo
# agrega una capa de indirección sobre bytes que además son públicos.
afterPack: scripts/adhoc-sign.cjs

# El addon nativo del actualizador va fuera del asar: `dlopen` no puede abrir
# un binario que está adentro de un archivo comprimido. Se conserva la
# jerarquía `native/build/Release` porque el `rpath` compilado en el addon la
# asume (ver `native/README.md`).
extraResources:
  - from: ../react-client/dist
    to: renderer
  - from: native/build/Release/sparkle_bridge.node
    to: native/build/Release/sparkle_bridge.node

asar: true
# No hay dependencias nativas: nada que recompilar contra los headers de Electron.
npmRebuild: false

mac:
  category: public.app-category.productivity
  target:
    # El bundle universal contiene los slices arm64 y x86_64. El DMG es lo que
    # baja una persona; el ZIP es de lo que Sparkle actualiza —no sabe
    # instalar desde un DMG—. Los dos salen del mismo bundle universal.
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  # @electron/universal debe dejar intacto este addon: ya llega combinado con
  # lipo y no se puede volver a combinar sin crear slices duplicados.
  x64ArchFiles: "**/sparkle_bridge.node"
  icon: assets/icon.png
  # Sin certificado de Apple Developer (ADR-131 §4): no se firma ni se
  # notariza. `identity: null` evita que electron-builder busque una identidad
  # y falle el build. La firma ad-hoc que sella el bundle —sin la cual una app
  # descargada muestra «está dañado» en vez de la advertencia con salida— la
  # pone `scripts/adhoc-sign.cjs`.
  identity: null
  darkModeSupport: false
  # `Sparkle.framework` va a `Contents/Frameworks/`, que es donde macOS espera
  # un framework: Sparkle lanza helpers desde adentro y no funciona bien fuera
  # de ahí. `extraFiles` en mac deposita relativo a `Contents/`.
  extraFiles:
    - from: native/vendor/Sparkle.framework
      to: Frameworks/Sparkle.framework
  # Sparkle lee la clave y el feed de acá y **no** de código: no expone un
  # setter de runtime para la clave, y es correcto que sea así — horneada en
  # el Info.plist queda cubierta por la firma del bundle, mientras que una
  # constante en JS vive adentro del asar, que cualquiera reemplaza.
  #
  # La privada del par vive como secret `SPARKLE_PRIVATE_KEY` de GitHub
  # Actions y nunca en el repo (ADR-131 §4). Si esta clave se cambia, las
  # instalaciones existentes dejan de aceptar actualizaciones: la validan
  # contra la que tienen horneada.
  extendInfo:
    SUPublicEDKey: "8kemzn0NGGxaJS7v8Ko6Pit46kot+7bzSghGPAcwB+s="
    SUFeedURL: https://github.com/sgiambelluca/Anonly/releases/latest/download/appcast.xml
    SUEnableAutomaticChecks: true

# Sin `hardenedRuntime` ni `entitlements`: los exige la notarización, que no
# hacemos. Ponerlos sin notarizar solo agrega restricciones sin ganar nada.

dmg:
  title: ${productName}
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.png
  # `NsisUpdater.verifySignature()` retorna antes de invocar el callback si no
  # hay publisherName. Este valor reservado fuerza la verificación Ed25519
  # propia sin afirmar que exista Authenticode (ADR-137 §4). Cuando llegue
  # SignPath se reemplaza por el DN/CN real y el callback exige ambas firmas.
  signtoolOptions:
    publisherName: "__ANONLY_ED25519_ONLY__"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Anonly

# El updater lee de acá: los releases del repo, sin hosting propio
# (ADR-131 §1). `electron-updater` en Windows; macOS va por Sparkle.
publish:
  provider: github
  owner: sgiambelluca
  repo: Anonly
