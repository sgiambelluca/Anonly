<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Placa: geometria de icono de macOS (824 centrado en 1024, radio 185). -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#plate)"/>

  <!-- La marca de Logo.tsx, escalada del viewBox 32 al de 1024.
       La pagina va RELLENA en blanco en vez de contorneada: a 32 px en una
       barra de tareas un contorno se pierde, un bloque blanco sobre la placa
       oscura no. -->
  <g transform="translate(225.1 207.2) scale(17.93)" filter="url(#lift)">
    <path d="M8 2.5h10.5L26 10v19.5a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-25a2 2 0 0 1 2-2Z" fill="#ffffff"/>
    <!-- Esquina doblada: solida, no un trazo. -->
    <path d="M18.5 2.5 26 10h-5.5a2 2 0 0 1-2-2Z" fill="#94a3b8"/>
    <!-- Texto: detalle que aparece al crecer. -->
    <rect x="10.5" y="13.6" width="9" height="1.9" rx="0.95" fill="#cbd5e1"/>
    <rect x="10.5" y="24.4" width="6.5" height="1.9" rx="0.95" fill="#cbd5e1"/>
    <!-- La barra: el heroe. Es lo unico que tiene que sobrevivir a 16 px. -->
    <rect x="10.5" y="17.8" width="11" height="4.6" rx="1.1" fill="url(#bar)"/>
  </g>
</svg>
